version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - microservices-network

  user-service:
    build: ./UserService
    container_name: user-service
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/user-service-db
    networks:
      - microservices-network

  product-service:
    build: ./ProductService
    container_name: product-service
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/product-service-db
    networks:
      - microservices-network

  order-service:
    build: ./OrderService
    container_name: order-service
    ports:
      - "3003:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/order-service-db
    networks:
      - microservices-network

  api-gateway:
    build: ./APIGateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - NODE_SERVER_PORT=8000
      - NODE_SERVER_HOST=0.0.0.0
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - microservices-network

  frontend:
    build: ./Frontend/frontend-app
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  mongo-data:
